<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background: rgba(18,19,17,0.9); backdrop-filter: blur(14px); border-bottom: 1px solid #262924; font-family: 'Space Grotesk', sans-serif;">
  <div style="max-width: 1320px; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 40px; height: 66px;">
    <a href="Home.dc.html" style="color: #f2f3ee; font-size: 16.5px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; text-decoration: none;">Genuine Optimum</a>

    <nav style="display: flex; align-items: center; gap: 30px; font-size: 14px;">
      <a href="Capabilities.dc.html" style="color: #9aa093; text-decoration: none;" style-hover="color: #f2f3ee;">Capabilities</a>

      <div onMouseEnter="{{ open }}" onMouseLeave="{{ close }}" style="position: relative; padding: 22px 0;">
        <a href="Dispatch OS.dc.html" style="color: #9aa093; text-decoration: none; display: flex; align-items: center; gap: 7px;" style-hover="color: #f2f3ee;">Products
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: #6f7469;">&#9660;</span>
        </a>
        <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: 100%; left: -20px; width: 400px; background: #1a1c19; border: 1px solid #2f332e; box-shadow: 0 24px 48px rgba(0,0,0,0.5);">
            <a href="Dispatch OS.dc.html" style="display: block; padding: 18px 20px; border-bottom: 1px solid #262924; text-decoration: none;" style-hover="background: #22251f;">
              <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
                <span style="color: #f2f3ee; font-size: 15px; font-weight: 500;">Dispatch OS</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #cddb3c;">FLAGSHIP</span>
              </div>
              <div style="font-size: 13px; line-height: 1.5; color: #9aa093; padding-top: 5px;">Load, driver, and document board for US truck dispatchers.</div>
            </a>
            <a href="AI Voice Agent.dc.html" style="display: block; padding: 18px 20px; border-bottom: 1px solid #262924; text-decoration: none;" style-hover="background: #22251f;">
              <div style="color: #f2f3ee; font-size: 15px; font-weight: 500;">AI Voice Agent</div>
              <div style="font-size: 13px; line-height: 1.5; color: #9aa093; padding-top: 5px;">Answers, qualifies, and books calls in natural speech.</div>
            </a>
            <a href="Construction Finance Suite.dc.html" style="display: block; padding: 18px 20px; text-decoration: none;" style-hover="background: #22251f;">
              <div style="color: #f2f3ee; font-size: 15px; font-weight: 500;">Construction Finance Suite</div>
              <div style="font-size: 13px; line-height: 1.5; color: #9aa093; padding-top: 5px;">Budgets, expenses, and inventory across build projects.</div>
            </a>
          </div>
        </sc-if>
      </div>

      <a href="Work.dc.html" style="color: #9aa093; text-decoration: none;" style-hover="color: #f2f3ee;">Work</a>
      <a href="Contact.dc.html" style="color: #9aa093; text-decoration: none;" style-hover="color: #f2f3ee;">Contact</a>
    </nav>

    <a href="Contact.dc.html" style="background: #cddb3c; color: #121311; font-size: 13.5px; font-weight: 500; padding: 11px 18px; white-space: nowrap; text-decoration: none;" style-hover="background: #e2ee6b; color: #121311;">Book a call</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:300}}">
class Component extends DCLogic {
  state = { isOpen: false };
  renderVals() {
    return {
      isOpen: this.state.isOpen,
      open: () => this.setState({ isOpen: true }),
      close: () => this.setState({ isOpen: false })
    };
  }
}
</script>
</body>
</html>
