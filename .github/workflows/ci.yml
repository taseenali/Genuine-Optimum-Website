name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Blocks on what ships to visitors. A flaw in development-only tooling
      # (the linter chain, for example) cannot reach production, and when no
      # patched release exists a gate on it can only fail forever. The full
      # audit below still runs and is shown, but does not block.
      - run: npm audit --omit=dev --audit-level=high
      - name: Full audit, including dev tooling (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run lint
      - run: npm run build
